[package]
name = "colorvideovdp"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Pure-Rust port of the ColorVideoVDP (cvvdp) image and video quality metric"
license = "MIT"
repository = "https://github.com/Tavrin/colorvideovdp-rs"
documentation = "https://docs.rs/colorvideovdp"
readme = "README.md"
keywords = ["colorvideovdp", "cvvdp", "image-quality", "video-quality", "metric"]
categories = ["multimedia::images", "multimedia::video", "science"]
include = ["/src", "/data/*.json", "/README.md", "/LICENSE", "/CHANGELOG.md", "/examples/*.rs"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["parallel"]
# Split independent spatial rows across the Rayon thread pool.
parallel = ["dep:rayon"]

[dependencies]
rayon = { version = "1.10", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
