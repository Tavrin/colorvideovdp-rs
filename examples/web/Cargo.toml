# WebAssembly bindings for the browser demo in this directory. This package is
# not published; it keeps wasm-bindgen out of the colorvideovdp crate.
[package]
name = "colorvideovdp-web"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
colorvideovdp = { path = "../..", default-features = false }
js-sys = "0.3.91"
wasm-bindgen = "=0.2.114"

[profile.release]
opt-level = 3
