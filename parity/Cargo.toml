[package]
name = "colorvideovdp-parity"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
publish = false

[features]
default = ["parallel"]
parallel = ["colorvideovdp/parallel", "dep:rayon"]

[dependencies]
colorvideovdp = { path = "..", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = { version = "1.10", optional = true }
